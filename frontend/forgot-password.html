<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akwire | Interactive Cybersecurity Training Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <nav class="navbar">
        <div class="logo"><a href="#"><img src="images/logo.png" alt="Akwire Logo"></div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="academy.html" class="active">Academy</a></li>
            <li><a href="labs.html" class="active">Labs</a></li>
            <li><a href="exam.html" class="active">Exam</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="profile.html" class="active">Profile</a></li>
            <li id="auth-link"><a href="login.html" class="btn-primary">Login</a></li>
        </ul>
    </nav>

    <div class="login-page">
        <div class="login-container">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="terminal-title">RECOVERY_MODE</span>
            </div>

            <h2>Password Recovery</h2>
            <p>Initialize identity verification protocol.</p>

            <form id="recovery-form">
                <div class="input-group">
                    <label for="recovery-email">Email</label>
                    <input type="email" id="recovery-email" placeholder="name@agency.com" required>
                </div>
                
                <button type="submit" class="btn-primary">Reset</button>
            </form>

            <div class="login-footer">
                <a href="login.html">Return to Terminal</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
