<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Builder | Akwire</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="admin-page">

    <div class="dashboard-wrapper">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo-section">
                <img src="images/logo.png" class="logo" alt="Akwire Logo" />
                <h2>Administrator</h2>
                <span class="logo-subtitle">Control Panel</span>
            </div>

            <nav class="sidebar-nav">
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>

                <a href="dashboard.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Student Dashboard</span>
                </a>

                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="create-course.html" class="active">
                    <i class="fa-solid fa-book"></i>
                    <span>Course Management</span>
                </a>

                <a href="admin-exams.html">
                    <i class="fa-solid fa-file-circle-check"></i>
                    <span>Exam Management</span>
                </a>

                <a href="admin-labs.html">
                    <i class="fa-solid fa-flask"></i>
                    <span>Lab Management</span>
                </a>

                <a href="admin-users.html">
                    <i class="fa-solid fa-users"></i>
                    <span>User Management</span>
                </a>

                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Reports</span>
                </a>

                <a href="admin-settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content admin-main course-builder-page">

            <div class="admin-header">
                <div>
                    <h1 id="courseTitle">Course Builder</h1>
                    <p>Add modules and lessons to this course.</p>
                </div>
            </div>

            <div class="admin-table-card builder-card">

                <!-- ADD MODULE -->
                <section class="builder-section">
                    <h2>Add Module</h2>

                    <div class="builder-row">
                        <input
                            type="text"
                            id="moduleTitle"
                            class="admin-search-input"
                            placeholder="Module Title"
                        />

                        <button
                            id="addModuleBtn"
                            class="btn"
                            type="button"
                        >
                            Add Module
                        </button>
                    </div>
                </section>

                <hr class="builder-divider" />

                <!-- MODULES LIST -->
                <section class="builder-section">
                    <h2>Modules & Lessons</h2>
                    <div id="modulesContainer" class="modules-container"></div>
                </section>

            </div>

        </main>
    </div>

    <script src="js/create-course.js"></script>
</body>
</html>
