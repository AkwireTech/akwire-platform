<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akwire | Interactive Cybersecurity Training Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Akwire Logo"></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="labs.html">Labs</a></li>
            <li><a href="exam.html">Exam</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <div class="login-page"> 
        <div class="register-container">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="terminal-title">NEW_USER_REGISTRATION</span>
            </div>
            
            <h2>Create Access Account</h2>
            <p>Complete the form to initialize your security training.</p>
            
            <form id="register-form">
                <div class="form-row">
                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John" required>
                    </div>
                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <div class="strength-meter">
                            <div id="strength-bar"></div>
                        </div>
                        <span id="strength-text" style="font-size: 0.75rem; color: #94a3b8;">Strength: Waiting for input...</span>
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Create Account</button>
            </form>
            
            <div class="login-footer">
                <p>Already have access? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="js/terminal.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
