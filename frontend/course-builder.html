<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Builder | Akwire</title>

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="dashboard-page">

<div class="dashboard-wrapper">

    <nav class="sidebar">

        <h1 style="color:white;">
            ADMIN PANEL
        </h1>

        <ul>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="create-course.html">
                    Create Course
                </a>
            </li>

            <li>
                <a href="course-builder.html"
                   class="active">
                    Course Builder
                </a>
            </li>

        </ul>

    </nav>

    <main class="main-content">

        <div class="content-header">

            <h1 id="courseTitle">
                Loading...
            </h1>

        </div>

        <div class="recommendations-panel">

            <h2>Add Module</h2>

            <input
                type="text"
                id="moduleTitle"
                placeholder="Module Title"
            >

            <button
                id="addModuleBtn"
                class="submit-feedback-btn"
            >
                Add Module
            </button>

            <hr style="margin:30px 0;">

            <div id="modulesContainer"></div>

        </div>

    </main>

</div>

<script src="js/course-builder.js"></script>

</body>

</html>
