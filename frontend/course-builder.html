<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Builder | Akwire</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="admin-page">

    <div class="dashboard-wrapper">

        <aside class="sidebar">

            <div class="logo">
                <img src="images/logo.png" alt="Akwire">
                <h2>Administrator</h2>
                <p>Control Panel</p>
            </div>

            <ul>
                <li>
                    <a href="admin-dashboard.html">
                        <i class="fas fa-chart-line"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-user-graduate"></i>
                        Student Dashboard
                    </a>
                </li>

                <li>
                    <a href="index.html">
                        <i class="fas fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="create-course.html" class="active">
                        <i class="fas fa-book"></i>
                        Course Management
                    </a>
                </li>

                <li>
                    <a href="create-exam.html">
                        <i class="fas fa-file-pen"></i>
                        Exam Management
                    </a>
                </li>

                <li>
                    <a href="create-lab.html">
                        <i class="fas fa-flask"></i>
                        Lab Management
                    </a>
                </li>

                <li>
                    <a href="admin-users.html">
                        <i class="fas fa-users"></i>
                        User Management
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        <i class="fas fa-chart-column"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        <i class="fas fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li class="logout-link">
                    <a href="#" onclick="logout()">
                        <i class="fas fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>
            </ul>

        </aside>

        <main class="main-content admin-main course-builder-page">

            <div class="admin-header">
                <div>
                    <h1 id="courseTitle">Course Builder</h1>
                    <p>Add modules to this course.</p>
                </div>
            </div>

            <div class="admin-table-card builder-card">

                <section class="builder-section">
                    <h2>Add Module</h2>

                    <div class="builder-row">
                        <input
                            type="text"
                            id="moduleTitle"
                            class="admin-search-input"
                            placeholder="Module Title"
                        />

                        <button
                            id="addModuleBtn"
                            class="btn"
                            type="button"
                        >
                            Add Module
                        </button>
                    </div>
                </section>

                <hr class="builder-divider" />

                <section class="builder-section">
                    <h2>Modules</h2>
                    <div id="modulesContainer" class="modules-container"></div>
                </section>

            </div>

        </main>
    </div>

        <!-- EDIT MODAL -->
    <div id="builderEditModal" class="builder-modal hidden">
        <div class="builder-modal-backdrop" id="builderModalBackdrop"></div>

        <div class="builder-modal-content">
            <div class="builder-modal-header">
                <h2 id="builderModalTitle">Edit</h2>
                <button
                    id="builderModalClose"
                    class="builder-modal-close"
                    type="button"
                >
                    &times;
                </button>
            </div>

            <div class="builder-modal-body">
                <!-- MODULE EDIT -->
                <div id="moduleEditFields" class="builder-modal-fields hidden">
                    <label for="editModuleTitle">Module Title</label>
                    <input
                        type="text"
                        id="editModuleTitle"
                        class="admin-search-input"
                        placeholder="Module Title"
                    />
                </div>

                <!-- LESSON EDIT -->
                <div id="lessonEditFields" class="builder-modal-fields hidden">
                    <label for="editLessonTitle">Lesson Title</label>
                    <input
                        type="text"
                        id="editLessonTitle"
                        class="admin-search-input"
                        placeholder="Lesson Title"
                    />

                    <label for="editLessonContent">Lesson Content</label>
                    <textarea
                        id="editLessonContent"
                        class="course-textarea lesson-structured-textarea builder-modal-textarea"
                        placeholder="Lesson Content"
                    ></textarea>

                    <label for="editLessonVideo">Video URL</label>
                    <input
                        type="text"
                        id="editLessonVideo"
                        class="admin-search-input"
                        placeholder="Video URL (optional)"
                    />
                </div>
            </div>

            <div class="builder-modal-footer">
                <button
                    id="builderModalCancel"
                    class="btn btn-secondary"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="builderModalSave"
                    class="btn"
                    type="button"
                >
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script src="js/course-builder.js"></script>
</body>
</html>
