<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Course | Akwire</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="dashboard-page">

    <div class="dashboard-wrapper">

        <nav class="sidebar">

            <h1 style="color:white;">
                ADMIN PANEL
            </h1>

            <ul>

                <li>
                    <a href="dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="create-course.html"
                       class="active">
                        Create Course
                    </a>
                </li>

            </ul>

        </nav>

        <main class="main-content">

           <div class="content-header">
                <h1>Course Builder</h1>
            </div>

            <div class="recommendations-panel">

                <h2 id="courseTitle"></h2>

                <hr>

                <h3>Add Module</h3>

                <input
                    type="text"
                    id="moduleTitle"
                    placeholder="Module Title"
                >

                <button
                    id="addModuleBtn"
                    class="submit-feedback-btn"
                >
                    Add Module
                </button>

                <hr>

                <div id="modulesContainer"></div>

            </div>

        </main>

    </div>

    <script src="js/create-course.js"></script>
    <script src="js/course-builder.js"></script>

</body>

</html>
