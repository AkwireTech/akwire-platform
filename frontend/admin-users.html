<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management | Akwire</title>

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">

</head>

<body class="admin-page">

    <div class="admin-layout">

        <aside class="admin-sidebar">

            <div class="admin-logo">
                <img src="images/logo.png" alt="Akwire">
                <h2>Administrator</h2>
                <p>Control Panel</p>
            </div>

            <ul class="admin-nav">

                <li>
                    <a href="admin-dashboard.html">
                        <i class="fas fa-chart-line"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-user-graduate"></i>
                        Student Dashboard
                    </a>
                </li>

                <li>
                    <a href="index.html">
                        <i class="fas fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="create-course.html">
                        <i class="fas fa-book"></i>
                        Course Management
                    </a>
                </li>

                <li>
                    <a href="create-exam.html">
                        <i class="fas fa-file-pen"></i>
                        Exam Management
                    </a>
                </li>

                <li>
                    <a href="create-lab.html">
                        <i class="fas fa-flask"></i>
                        Lab Management
                    </a>
                </li>

                <li>
                    <a href="admin-users.html" class="active">
                        <i class="fas fa-users"></i>
                        User Management
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        <i class="fas fa-chart-column"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        <i class="fas fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li class="admin-logout">
                    <a href="#" onclick="logout()">
                        <i class="fas fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <main class="admin-main">

            <div class="admin-header">
                <div>
                    <h1>User Management</h1>
                    <p>Manage students and administrators.</p>
                </div>
            </div>

            <div class="admin-table-card">

                <input
                    type="text"
                    id="searchUser"
                    placeholder="Search users..."
                    class="admin-search-input"
                >

                <table class="admin-users-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>

            </div>

        </main>

    </div>

    <script src="js/admin-users.js"></script>
</body>

</html>
